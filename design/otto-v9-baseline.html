<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otto — v9 baseline (design reference)</title>
<!-- REFERENCE ONLY. States, CLI output, music and timer are simulations, not native integrations. -->
<style>
:root{font-family:"Segoe UI",system-ui,sans-serif;color:#252525;background:#f5f5f5;--ink:#151515;--text:#fafafa;--muted:#a3a3a3;--raised:#292929;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #99bdf3;outline-offset:2px}svg{display:block;flex-shrink:0}
main{max-width:900px;margin:24px auto;padding:0 16px}.lab{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-bottom:12px;align-items:center}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.group{display:flex;gap:2px;background:#ebebeb;border:1px solid #d8d8d8;border-radius:11px;padding:3px}.group button{border:0;background:transparent;color:#646464;padding:7px 11px;border-radius:8px;font-size:12px}.group button.on{background:#fff;color:#151515;box-shadow:0 1px 2px #00000013}.action-lab{background:#fff;border:1px solid #d6d6d6;border-radius:9px;color:#333;padding:8px 11px;font-size:11px}
.stage{position:relative;isolation:isolate;overflow:hidden;height:430px;border-radius:16px;border:1px solid #d4d9e0;background:#e9ecf1}.stage.attached:before{content:"";position:absolute;inset:0 0 auto;height:1px;background:#aeb4be}.shell{--w:92px;--h:42px;--radius:999px;--shoulder:0px;position:absolute;top:20px;left:50%;transform:translateX(-50%);width:min(var(--w),calc(100% - 16px));height:var(--h);border-radius:var(--radius);background:var(--ink);color:var(--text);border:1px solid #343434;box-shadow:0 14px 28px #1b253529;transition:width .42s var(--ease),height .42s var(--ease),top .42s var(--ease),border-radius .42s var(--ease);overflow:hidden;z-index:2}.shell.extended{box-shadow:0 22px 44px #1b253531}.stage.attached .shell{top:0;--shoulder:12px;background:transparent;border:0;border-radius:0;box-shadow:none;overflow:visible}
.silhouette{display:none;position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0px 10px 12px #1b25352b);pointer-events:none}.stage.attached .silhouette{display:block}
.inner{position:absolute;inset:0 var(--shoulder);height:100%;min-width:0;display:flex;flex-direction:column}.surface{height:100%;width:100%;display:flex;flex-direction:column;min-height:0;animation:appear .2s var(--ease) both}@keyframes appear{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.eyes{width:32px;height:24px;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0}.eyes i{width:6px;height:13px;background:var(--text);border-radius:6px}.idle{width:100%;height:100%;display:grid;place-items:center;border:0;color:inherit;background:transparent}.idle:hover .eyes i{animation:blink .33s ease}@keyframes blink{50%{height:3px}}
.compact{display:flex;align-items:center;gap:8px;padding:0 10px;width:100%;height:100%;position:relative}.hit{display:flex;align-items:center;gap:9px;min-width:0;flex:1;height:100%;background:transparent;border:0;text-align:left;color:inherit;padding:0}.meta{min-width:0;flex:1}.meta strong{display:block;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta small{display:block;color:#b5b5b5;font-size:10px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.round-icon{width:31px;height:31px;display:grid;place-items:center;background:#2b2b2b;border-radius:50%;flex-shrink:0}
.icon{height:32px;width:32px;display:grid;place-items:center;border-radius:50%;background:transparent;border:0;color:#dedede;flex-shrink:0;transition:background .16s,transform .12s}.icon:hover{background:#393939}.icon:active{transform:scale(.94)}.icon.white{background:#f3f3f3;color:#161616}.icon.white:hover{background:#dcdcdc}
.cover{width:36px;height:36px;flex-shrink:0;overflow:hidden;border-radius:50%}.cover svg{height:100%;width:100%}
.bars{height:28px;width:32px;display:flex;align-items:center;justify-content:center;gap:3px;flex-shrink:0}.bars i{width:3px;height:4px;border-radius:2px;background:#ededed}.bars.live i{animation:wave .72s ease-in-out infinite alternate}.bars.live i:nth-child(2){animation-delay:-.22s}.bars.live i:nth-child(3){animation-delay:-.52s}.bars.live i:nth-child(4){animation-delay:-.32s}.bars.live i:nth-child(5){animation-delay:-.12s}@keyframes wave{to{height:17px;opacity:.75}}
.timeline{position:absolute;left:49px;right:47px;bottom:6px;height:2px;background:#494949;overflow:hidden;border-radius:2px}.timeline span,.progress span{display:block;height:100%;background:#efefef}
.home{height:100%;padding:15px 17px;display:flex;flex-direction:column;gap:12px}.homehead{height:24px;display:flex;align-items:center;gap:9px}.homehead strong{font-size:13px;font-weight:500}.homechoices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;flex:1;min-height:0}.choice{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;padding:11px;background:#262626;border:1px solid #373737;color:inherit;border-radius:15px}.choice:hover{background:#333}.choice strong{font-size:12px;font-weight:500}.choice small{display:block;font-size:10px;color:#aaa;margin-top:5px}
.head{height:46px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 17px;border-bottom:1px solid #303030}.homekey{width:31px;height:31px;border:0;display:grid;place-items:center;border-radius:10px;color:inherit;background:#292929;flex-shrink:0}.homekey:hover{background:#383838}.head strong{font-weight:500;font-size:12px}
.agent{height:100%;display:flex;flex-direction:column;min-height:0}.agenthead{height:39px;display:flex;align-items:center;justify-content:space-between;padding:6px 17px 0;flex-shrink:0}.status{display:flex;align-items:center;gap:6px;font-size:10px;color:#b8b8b8}.dot{width:5px;height:5px;background:#9fbaa9;border-radius:50%}.agentfeed{padding:8px 20px;overflow:auto;flex:1;min-height:0;scrollbar-width:thin;scrollbar-color:#484848 transparent}.question{margin:0 0 12px auto;width:max-content;max-width:85%;padding:9px 12px;background:#2c2c2c;border-radius:12px 12px 4px 12px;font-size:11px;overflow-wrap:anywhere}.event{display:flex;align-items:center;gap:7px;font-size:10px;color:#aaa;margin:8px 0}.answer{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.62}.caret{display:inline-block;width:5px;height:11px;background:#fff;animation:blink-caret .7s step-end infinite}@keyframes blink-caret{50%{opacity:0}}.notice{border:1px solid #574b39;background:#302b22;border-radius:12px;padding:11px;font-size:11px;line-height:1.5}.notice code{display:block;margin:8px 0;font:11px Consolas,monospace}.notice button{background:#eee;color:#171717;border:0;border-radius:8px;padding:7px 10px;font-size:11px;margin:5px 6px 0 0}.notice button.secondary{background:#454039;color:#fff}
.composeouter{padding:7px 12px 13px;flex-shrink:0}.composer{height:52px;border:0;border-radius:999px;background:#292929;display:flex;align-items:center;gap:5px;padding:0 7px}.composer input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:#fff;font-size:12px}.composer input::placeholder{color:#aaa}.provideranchor{position:relative;flex-shrink:0}.provider{height:34px;border:0;border-radius:999px;background:#3b3b3b;color:#eee;padding:0 10px;display:flex;align-items:center;gap:6px;font-size:11px}.providers{position:absolute;bottom:41px;left:0;min-width:168px;padding:5px;background:#282828;border:1px solid #484848;border-radius:11px;box-shadow:0 12px 30px #0009;z-index:10}.providers button{display:flex;justify-content:space-between;width:100%;gap:8px;padding:8px;border:0;background:transparent;border-radius:7px;color:#eee;font-size:11px}.providers button:hover{background:#393939}.providers small{color:#bbb}.providers p{border-top:1px solid #444;padding:8px 8px 3px;margin:4px 0 0;color:#bbb;font-size:10px}
.music{height:100%;display:flex;flex-direction:column}.musicmain{flex:1;display:flex;align-items:center;gap:13px;padding:12px 18px 8px;min-height:0}.musicart{height:64px;width:64px;border-radius:14px;overflow:hidden;flex-shrink:0}.musicart svg{height:100%;width:100%}.trackname{min-width:0;flex:1}.trackname strong{font-size:16px;font-weight:500}.trackname small{display:block;margin-top:6px;color:#aaa;font-size:11px}.mediacontrols{display:flex;gap:3px}.musicprogress{padding:0 19px 12px;display:flex;align-items:center;gap:9px}.musicprogress small{font:10px Consolas,monospace;color:#aaa}.progress{height:3px;background:#494949;flex:1;border-radius:3px;overflow:hidden}
.focus{height:100%;display:flex;flex-direction:column}.focusmain{flex:1;min-height:0;display:flex;align-items:center;gap:12px;padding:12px 20px}.focustime{font-size:39px;letter-spacing:-.035em;font-variant-numeric:tabular-nums;font-weight:400}.focusbottom{display:flex;align-items:center;gap:9px;padding:0 20px 15px}.phase,.step{border:1px solid #464646;background:#2d2d2d;color:#eee;border-radius:8px;padding:7px 10px;font-size:10px}.step{width:26px;height:27px;padding:0;font-size:13px}.duration{font-size:10px;color:#ccc;white-space:nowrap}
.stagehint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#828b98;font-size:10px}.metafoot{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#6b6b6b;margin-top:10px}.metafoot strong{font-weight:500;font-variant-numeric:tabular-nums}.footnote{font-size:11px;color:#777;line-height:1.5;margin-top:8px}
@media(max-width:550px){.stage{height:408px}.home{padding:12px}.homechoices{gap:5px}.choice{padding:9px}.head{padding:0 12px}.agenthead{padding:6px 12px 0}.agentfeed{padding:8px 12px}.composeouter{padding:6px 8px 10px}.composer{padding:0 5px}.provider{padding:0 8px}.musicmain{padding:10px;gap:8px}.musicart{height:52px;width:52px}.trackname strong{font-size:14px}.focusmain{padding:10px 12px}.focusbottom{padding:0 12px 13px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
  <div class="lab">
    <div class="controls">
      <div class="group" aria-label="Module"><button data-module="home" class="on">Idle</button><button data-module="agent">Agent</button><button data-module="music">Music</button><button data-module="focus">Focus</button></div>
      <div class="group" aria-label="Presentation"><button data-presentation="compact" class="on">Compact</button><button data-presentation="expanded">Expanded</button></div>
    </div>
    <div class="group" aria-label="Placement"><button data-placement="floating" class="on">Floating</button><button data-placement="attached">Attached</button></div>
  </div>
  <div class="lab">
    <div class="controls"><button class="action-lab" data-demo="agent">Simulate agent</button><button class="action-lab" data-demo="approval">Simulate approval</button><button class="action-lab" data-demo="focus">Start focus</button></div>
    <button class="action-lab" data-demo="speed" id="speed">Timer: 1×</button>
  </div>
  <div class="stage" id="stage">
    <div class="shell" id="shell">
      <svg class="silhouette" id="silhouette" aria-hidden="true" preserveAspectRatio="none"><path id="notch-path" fill="#151515" stroke="#363636" stroke-width="1"/></svg>
      <div class="inner"><div class="surface" id="surface"></div></div>
    </div>
    <div class="stagehint">Hover to expand · click to keep open · Esc / outside click to collapse</div>
  </div>
  <div class="metafoot"><span id="state-label">Idle · Compact · Floating</span><strong id="size-label">92 × 42</strong></div>
  <p class="footnote">Design reference only. CLI, approvals, capture, playback, and focus speed-up are simulations. No OS actions or AI requests occur.</p>
</main>
<script>
(function(){
const stage=document.getElementById("stage"),shell=document.getElementById("shell"),surface=document.getElementById("surface"),outline=document.getElementById("silhouette"),shape=document.getElementById("notch-path");
const paths={terminal:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3m6 0h4"/>',music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',timer:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',play:'<path d="m8 5 11 7-11 7z"/>',pause:'<path d="M8 5v14m8-14v14"/>',next:'<path d="m5 5 9 7-9 7V5zm12 0v14"/>',prev:'<path d="m19 5-9 7 9 7V5zM7 5v14"/>',up:'<path d="M12 19V5m-6 6 6-6 6 6"/>',down:'<path d="m6 9 6 6 6-6"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',reset:'<path d="M3 11a9 9 0 1 1 3 7M3 4v7h7"/>',camera:'<rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="12" cy="12" r="4"/>',check:'<path d="m5 12 5 5L20 7"/>'};
const icon=(name,size=16)=>'<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+paths[name]+'</svg>';
const safe=t=>String(t??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const eyes='<span class="eyes" aria-hidden="true"><i></i><i></i></span>';
const action=(id,name,label,style="")=>'<button type="button" class="icon '+style+'" data-action="'+id+'" aria-label="'+label+'" title="'+label+'">'+icon(name)+'</button>';
const art='<svg viewBox="0 0 80 80" role="img" aria-label="Original Blue Hour artwork"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#354d70"/><stop offset=".55" stop-color="#897d96"/><stop offset="1" stop-color="#e3ab94"/></linearGradient></defs><rect width="80" height="80" fill="url(#sky)"/><circle cx="56" cy="26" r="11" fill="#ffdfb8"/><path d="M0 56 20 37 39 54 58 35 80 55V80H0Z" fill="#435775"/><path d="M0 67Q23 54 40 64T80 63V80H0Z" fill="#244459"/></svg>';
const time=t=>String(Math.floor(Math.max(0,Math.ceil(t))/60)).padStart(2,"0")+":"+String(Math.max(0,Math.ceil(t))%60).padStart(2,"0");
const answer="The CLI process should be owned by Rust, independent of the notch view.\n\nCollapsing Otto changes presentation only. Reopening restores ordered events from the same active run.\n\nOnly Stop cancels the turn. This is simulated output.";
const state={module:"home",expanded:false,pinned:false,placement:"floating",agent:"ready",provider:"Codex",providerMenu:false,draft:"",question:"",reply:"",notice:"",seq:0,playing:true,musicProgress:32,focusMinutes:25,breakMinutes:5,phase:"focus",remaining:1500,timerRunning:false,speed:1};
const metrics={home:{compact:[92,42],expanded:[452,148]},agent:{compact:[228,50],expanded:[526,142]},music:{compact:[264,54],expanded:[444,178]},focus:{compact:[224,52],expanded:[408,174]}};
let hoverIn=0,hoverOut=0,runDelay=0,runInterval=0,outlineFrame=0,lastTick=performance.now();
function active(){return state.agent==="thinking"||state.agent==="streaming"}
function total(){return (state.phase==="focus"?state.focusMinutes:state.breakMinutes)*60}
function fraction(){return Math.max(0,Math.min(100,state.remaining/total()*100))}
function dims(){let d=metrics[state.module][state.expanded?"expanded":"compact"].slice();if(state.module==="agent"&&state.expanded){if(state.agent==="thinking")d[1]=220;else if(["streaming","complete","stopped"].includes(state.agent))d[1]=326;else if(state.agent==="approval")d[1]=280;else if(state.agent==="error"||state.notice)d[1]=230}return d}
function updateShape(){
 if(state.placement!=="attached")return;
 const w=shell.getBoundingClientRect().width,h=shell.getBoundingClientRect().height,S=12,R=Math.max(14,Math.min(state.expanded?28:h*.54,h-14,(w-24)*.4)),right=w-S;
 const d="M0 0 C8 0 12 5 12 12 L12 "+(h-R)+" C12 "+(h-R*.45)+" "+(12+R*.45)+" "+h+" "+(12+R)+" "+h+" L"+(right-R)+" "+h+" C"+(right-R*.45)+" "+h+" "+right+" "+(h-R*.45)+" "+right+" "+(h-R)+" L"+right+" 12 C"+right+" 5 "+(w-8)+" 0 "+w+" 0 Z";
 outline.setAttribute("viewBox","0 0 "+w+" "+h);shape.setAttribute("d",d);
}
function morphOutline(){cancelAnimationFrame(outlineFrame);let start=performance.now();function frame(t){updateShape();if(t-start<480)outlineFrame=requestAnimationFrame(frame)}outlineFrame=requestAnimationFrame(frame)}
function geometry(){const [w,h]=dims(),outer=w+(state.placement==="attached"?24:0);
shell.style.setProperty("--w",outer+"px");shell.style.setProperty("--h",h+"px");shell.style.setProperty("--radius",state.expanded?"28px":"999px");shell.classList.toggle("extended",state.expanded);stage.classList.toggle("attached",state.placement==="attached");
document.getElementById("state-label").textContent=(state.module==="home"?"Idle":state.module[0].toUpperCase()+state.module.slice(1))+" · "+(state.expanded?"Expanded":"Compact")+" · "+state.placement;
document.getElementById("size-label").textContent=outer+" × "+h;
document.querySelectorAll("[data-module]").forEach(b=>b.classList.toggle("on",b.dataset.module===state.module));document.querySelectorAll("[data-presentation]").forEach(b=>b.classList.toggle("on",b.dataset.presentation===(state.expanded?"expanded":"compact")));document.querySelectorAll("[data-placement]").forEach(b=>b.classList.toggle("on",b.dataset.placement===state.placement));
morphOutline()}
function compact(){
 if(state.module==="home")return '<button class="idle" data-action="open" aria-label="Open Home">'+eyes+'</button>';
 if(state.module==="agent"){const label=active()?"Codex":state.agent==="complete"?"Answer ready":state.agent==="approval"?"Approval needed":state.agent==="error"?"Unavailable":"Codex";
 return '<div class="compact"><button class="hit" data-action="open"><span class="round-icon">'+icon(state.agent==="complete"?"check":"terminal")+'</span><span class="meta"><strong>'+label+'</strong><small>'+({ready:"Ready",thinking:"Thinking",streaming:"Responding",approval:"Waiting",complete:"Complete",stopped:"Stopped",error:"Not connected"}[state.agent])+'</small></span></button>'+(active()?'<div class="bars live" aria-label="Agent working"><i></i><i></i><i></i><i></i></div>':'')+'</div>'}
 if(state.module==="music")return '<div class="compact"><button class="hit" data-action="open"><span class="cover">'+art+'</span><span class="meta"><strong>Blue Hour</strong><small>Otto Studio</small></span></button><button class="icon" data-action="music-toggle" aria-label="Toggle simulated playback"><span class="bars '+(state.playing?'live':'')+'" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></button></div>';
 return '<div class="compact"><button class="hit" data-action="open"><span class="round-icon">'+icon("timer")+'</span><span class="meta"><strong data-clock style="font-size:17px;font-variant-numeric:tabular-nums">'+time(state.remaining)+'</strong></span></button>'+action("timer-toggle",state.timerRunning?"pause":"play","Toggle timer","white")+'<div class="timeline"><span data-remaining style="width:'+fraction()+'%"></span></div></div>';
}
function home(){return '<div class="home"><div class="homehead">'+eyes+'<strong>Otto</strong></div><div class="homechoices">'+[["agent","terminal","Agent",active()?"Working":"Local CLI"],["music","music","Music",state.playing?"Playing":"Paused"],["focus","timer","Focus",state.timerRunning?time(state.remaining):"Pomodoro"]].map(([id,ic,label,sub])=>'<button class="choice" data-action="module" data-value="'+id+'"><span><strong>'+label+'</strong><small>'+sub+'</small></span>'+icon(ic,18)+'</button>').join("")+'</div></div>'}
function header(label){return '<div class="head"><button class="homekey" data-action="home" aria-label="Home">'+eyes+'</button><strong>'+label+'</strong></div>'}
function provider(){return '<div class="provideranchor"><button class="provider" data-action="providers" type="button">'+icon("terminal",13)+safe(state.provider)+icon("down",12)+'</button>'+(state.providerMenu?'<div class="providers">'+["Codex","Agy","Pi","OpenCode"].map(p=>'<button data-action="provider" data-value="'+p+'">'+p+'<small>'+(p==="Codex"?"Demo":"Unavailable")+'</small></button>').join("")+'<p>Workspace: otto<br>Quick Ask demo; no write permissions verified</p></div>':'')+'</div>'}
function agent(){
let status=active()?'<span class="bars live" style="width:22px;height:15px"><i></i><i></i><i></i><i></i></span> '+(state.agent==="thinking"?"Thinking":"Responding"):state.agent==="complete"?"Answer ready":state.agent==="approval"?"Approval needed":state.agent==="error"?"Unavailable":"Ready";
let feed='<div class="agentfeed" id="feed">';
if(state.question)feed+='<div class="question">'+safe(state.question)+'</div>';
if(active())feed+='<div class="event"><span class="bars live" style="width:22px;height:14px"><i></i><i></i><i></i><i></i></span>'+(state.agent==="thinking"?"Reading context":"Writing response")+'</div>';
if(state.reply)feed+='<div class="answer" id="answer">'+safe(state.reply)+(state.agent==="streaming"?'<span class="caret"></span>':'')+'</div>';
if(state.agent==="approval")feed+='<div class="notice"><strong>Allow this command?</strong><code>git status --short</code>Simulated approval only<div><button data-action="approve">Allow once</button><button class="secondary" data-action="deny">Deny</button></div></div>';
if(state.agent==="error")feed+='<div class="notice">'+safe(state.provider)+' unavailable<div><button data-action="recover">Use Codex demo</button></div></div>';
if(state.notice)feed+='<div class="notice">'+safe(state.notice)+'<div><button data-action="dismiss">Dismiss</button></div></div>';
feed+='</div>';
const busy=active()||state.agent==="approval";
return '<div class="agent"><div class="agenthead"><button class="homekey" data-action="home" aria-label="Home">'+eyes+'</button><span class="status">'+status+'</span></div>'+feed+'<div class="composeouter"><form id="compose" class="composer">'+provider()+'<input id="prompt" aria-label="Ask agent" placeholder="Ask '+safe(state.provider)+'…" value="'+safe(state.draft)+'" '+(busy?'disabled':'')+'>'+action("capture","camera","Capture unavailable")+(busy?action("stop","stop","Stop agent","white"):'<button type="submit" class="icon white" aria-label="Send">'+icon("up")+'</button>')+'</form></div></div>'}
function music(){return '<div class="music">'+header("Music")+'<div class="musicmain"><div class="musicart">'+art+'</div><div class="trackname"><strong>Blue Hour</strong><small>Otto Studio</small></div><div class="mediacontrols">'+action("prev","prev","Previous")+action("music-toggle",state.playing?"pause":"play","Play / Pause","white")+action("next","next","Next")+'</div></div><div class="musicprogress"><small>1:14</small><div class="progress"><span data-music style="width:'+state.musicProgress+'%"></span></div><small>3:52</small></div></div>'}
function focus(){return '<div class="focus">'+header("Focus")+'<div class="focusmain"><div style="flex:1"><div class="focustime" data-clock>'+time(state.remaining)+'</div></div>'+action("timer-toggle",state.timerRunning?"pause":"play","Pause / Start","white")+action("reset","reset","Reset")+'</div><div class="focusbottom"><button class="phase" data-action="phase">'+(state.phase==="focus"?"Focus":"Break")+'</button><button class="step" data-action="dec">−</button><span class="duration">'+(state.phase==="focus"?state.focusMinutes:state.breakMinutes)+'m</span><button class="step" data-action="inc">+</button><div class="progress"><span data-remaining style="width:'+fraction()+'%"></span></div></div></div>'}
function render(){geometry();surface.innerHTML=!state.expanded?compact():state.module==="home"?home():state.module==="agent"?agent():state.module==="music"?music():focus();if(active()&&state.expanded&&state.module==="agent"){const f=document.getElementById("feed");if(f)f.scrollTop=f.scrollHeight}}
function stopAgentTimers(){state.seq++;clearTimeout(runDelay);clearInterval(runInterval)}
function startAgent(){stopAgentTimers();const id=state.seq;state.agent="thinking";state.reply="";state.question=state.question||"How should Otto preserve agent runs?";render();
runDelay=setTimeout(()=>{if(state.seq!==id)return;state.agent="streaming";render();let pos=0;runInterval=setInterval(()=>{if(state.seq!==id||state.agent!=="streaming"){clearInterval(runInterval);return}pos=Math.min(answer.length,pos+4);state.reply=answer.slice(0,pos);const out=document.getElementById("answer");if(out){out.textContent=state.reply;const c=document.createElement("span");c.className="caret";out.appendChild(c);const feed=document.getElementById("feed");if(feed)feed.scrollTop=feed.scrollHeight}if(pos===answer.length){clearInterval(runInterval);state.agent="complete";render()}},45)},850)}
function open(pin=false){state.expanded=true;state.pinned=pin||state.pinned;render()}
function collapse(){state.expanded=false;state.pinned=false;state.providerMenu=false;render()}
function module(id){state.module=id;state.expanded=true;state.pinned=true;state.providerMenu=false;render()}
function send(){let el=document.getElementById("prompt");if(el)state.draft=el.value;if(!state.draft.trim()||active()||state.agent==="approval")return;if(state.provider!=="Codex"){state.agent="error";render();return}state.question=state.draft.trim();state.draft="";startAgent()}
document.addEventListener("input",e=>{if(e.target.id==="prompt")state.draft=e.target.value});
document.addEventListener("submit",e=>{if(e.target.id==="compose"){e.preventDefault();send()}});
document.addEventListener("pointerdown",e=>{if(shell.contains(e.target)&&e.target.closest("button,input"))state.pinned=true});
document.addEventListener("click",e=>{let b=e.target.closest("[data-action],[data-module],[data-presentation],[data-placement],[data-demo]");if(!b)return;let a=b.dataset.action,v=b.dataset.value;
if(b.dataset.module){state.module=b.dataset.module;state.expanded=false;state.pinned=false;render();return}
if(b.dataset.presentation){state.expanded=b.dataset.presentation==="expanded";state.pinned=state.expanded;render();return}
if(b.dataset.placement){state.placement=b.dataset.placement;render();return}
if(b.dataset.demo){if(b.dataset.demo==="agent"){state.module="agent";state.question="How should Otto handle CLI sessions?";startAgent()}if(b.dataset.demo==="approval"){stopAgentTimers();state.module="agent";state.expanded=true;state.pinned=true;state.agent="approval";state.question="Check repository status";state.reply="";render()}if(b.dataset.demo==="focus"){state.module="focus";state.expanded=false;if(!state.timerRunning){state.timerRunning=true;lastTick=performance.now()}render()}if(b.dataset.demo==="speed"){state.speed=state.speed===1?60:1;document.getElementById("speed").textContent="Timer: "+state.speed+"×"}return}
if(a==="open"){open(true);return}
if(a==="home"){module("home");return}
if(a==="module"){module(v);return}
if(a==="providers"){state.providerMenu=!state.providerMenu;render();return}
if(a==="provider"){if(active())return;state.provider=v;state.providerMenu=false;state.agent=v==="Codex"?"ready":"error";render();return}
if(a==="recover"){state.provider="Codex";state.agent="ready";render();return}
if(a==="capture"){state.notice="Capture unavailable in the browser reference. Nothing was sent.";render();return}
if(a==="dismiss"){state.notice="";render();return}
if(a==="stop"){stopAgentTimers();state.agent="stopped";render();return}
if(a==="approve"){startAgent();return}
if(a==="deny"){state.agent="stopped";render();return}
if(a==="music-toggle"){state.playing=!state.playing;render();return}
if(a==="next"||a==="prev"){state.musicProgress=8;render();return}
if(a==="timer-toggle"){state.timerRunning=!state.timerRunning;lastTick=performance.now();render();return}
if(a==="reset"){state.timerRunning=false;state.remaining=total();render();return}
if(a==="phase"){state.phase=state.phase==="focus"?"break":"focus";state.remaining=total();state.timerRunning=false;render();return}
if(a==="dec"||a==="inc"){let key=state.phase==="focus"?"focusMinutes":"breakMinutes";state[key]=Math.max(1,Math.min(120,state[key]+(a==="inc"?1:-1)));if(!state.timerRunning)state.remaining=total();render()}
});
shell.addEventListener("pointerenter",e=>{if(!["mouse","pen"].includes(e.pointerType))return;clearTimeout(hoverOut);if(!state.expanded)hoverIn=setTimeout(()=>open(false),150)});
shell.addEventListener("pointerleave",e=>{if(!["mouse","pen"].includes(e.pointerType))return;clearTimeout(hoverIn);if(state.expanded&&!state.pinned&&!shell.contains(document.activeElement))hoverOut=setTimeout(collapse,340)});
stage.addEventListener("click",e=>{if(!shell.contains(e.target))collapse()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")collapse()});
let previous=performance.now();setInterval(()=>{const now=performance.now(),elapsed=Math.min(1,(now-previous)/1000);previous=now;if(state.timerRunning){state.remaining=Math.max(0,state.remaining-elapsed*state.speed);if(state.remaining===0)state.timerRunning=false}if(state.playing){state.musicProgress=Math.min(100,state.musicProgress+elapsed*.3);if(state.musicProgress===100)state.playing=false}
document.querySelectorAll("[data-clock]").forEach(el=>el.textContent=time(state.remaining));document.querySelectorAll("[data-remaining]").forEach(el=>el.style.width=fraction()+"%");document.querySelectorAll("[data-music]").forEach(el=>el.style.width=state.musicProgress+"%")},160);
window.addEventListener("resize",morphOutline);render();
})();
</script>
</body>
