<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Otto OS Events — Micro-Instrument v7</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;font:13px 'Plus Jakarta Sans Variable','Plus Jakarta Sans','Jakarta Sans','Segoe UI',system-ui,sans-serif;color:#222}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #9bb9e5;outline-offset:2px}
#ot7{--surface:#151515;--fg:#fafafa;--muted:#a3a3a3;--ease:cubic-bezier(.22,1,.36,1);padding:15px 16px;max-width:860px;margin:0 auto}
.ot7-tools{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:9px;margin-bottom:10px}.ot7-toolbar-group{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.ot7-seg{display:flex;gap:2px;padding:3px;border-radius:11px;background:#f3f3f3;border:1px solid #dedede}.ot7-seg button{background:transparent;border:0;padding:7px 11px;border-radius:8px;color:#737373;font-size:11px}.ot7-seg button.active{background:#fff;color:#242424;box-shadow:0 1px 2px #00000015}
.ot7-triggers{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}.ot7-trigger{background:#fff;border:1px solid #ddd;border-radius:9px;padding:8px 10px;color:#333;font-size:11px;transition:background .15s,transform .1s}.ot7-trigger:hover{background:#f1f1f1}.ot7-trigger:active{transform:scale(.96)}
.ot7-stage{height:247px;border:1px solid #d9dfe7;border-radius:15px;background:#e9ecf0;position:relative;isolation:isolate;overflow:hidden}.ot7-stage:before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:#fff8}.ot7-stage.attached:before{background:#a7afb8}
.ot7-shell{--w:92px;--h:42px;--shoulder:0px;position:absolute;left:50%;top:22px;transform:translateX(-50%);height:var(--h);width:min(var(--w),calc(100% - 16px));border:1px solid #343434;border-radius:999px;background:var(--surface);color:var(--fg);overflow:hidden;z-index:5;box-shadow:0 12px 24px #1b263229;transition:width .38s var(--ease),height .38s var(--ease),top .38s var(--ease),box-shadow .38s var(--ease)}
.ot7-stage.attached .ot7-shell{--shoulder:12px;top:0;border:0;background:transparent;box-shadow:none;border-radius:0;overflow:visible}.ot7-silhouette{display:none;position:absolute;inset:0;width:100%;height:100%;pointer-events:none;filter:drop-shadow(0px 11px 12px #1b26322a)}.ot7-stage.attached .ot7-silhouette{display:block}
.ot7-viewport{position:absolute;inset:0 var(--shoulder);height:100%;overflow:hidden}.ot7-content{width:100%;height:100%;display:flex;align-items:center;min-width:0;animation:ot7-appear .25s var(--ease) .045s both}@keyframes ot7-appear{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.ot7-eyes{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:100%}.ot7-eyes i{width:6px;height:13px;border-radius:5px;background:#fafafa}
.ot7-row{height:100%;display:flex;align-items:center;gap:9px;width:100%;min-width:0;padding:0 12px}.ot7-left{width:31px;height:32px;display:grid;place-items:center;flex-shrink:0;position:relative;color:#ededed}.ot7-left svg{display:block}.ot7-secondary{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;font-weight:500;line-height:1.12}.ot7-smalltext{color:#aaa;font-size:10px;font-weight:400;margin-top:4px}.ot7-value{font-size:20px;font-weight:500;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap}.ot7-value small{font-size:11px;color:#b3b3b3;font-weight:400;letter-spacing:0}
.ot7-meter{display:flex;align-items:center;gap:3px;flex:1;min-width:34px;height:27px}.ot7-meter i{width:4px;flex:1;max-width:7px;border-radius:4px;height:var(--barH);background:#424242;transition:background .18s,height .18s}.ot7-meter i.lit{background:#eee}.ot7-iconwrap{width:33px;height:33px;display:grid;place-items:center;border-radius:50%;background:#2b2b2b;flex-shrink:0}
.ot7-wave{display:block;width:33px;height:34px;overflow:visible}.ot7-wave .ot7-arc{stroke:#f0f0f0;stroke-width:2;fill:none;stroke-linecap:round;opacity:var(--opacity)}.ot7-arc{transition:opacity .15s}.ot7-up .ot7-arc{animation:ot7-pulse .32s ease-out both}@keyframes ot7-pulse{from{transform:translateX(-3px);opacity:0}to{transform:translateX(0);opacity:var(--opacity)}}
.ot7-sun{width:33px;height:33px}.ot7-sun .ot7-rays{transform-origin:16.5px 16.5px;transition:transform .32s var(--ease);transform:rotate(var(--rotate))}.ot7-sun line{stroke:#f1f1f1;stroke-width:2.2;stroke-linecap:round}.ot7-sun circle{fill:#f1f1f1;opacity:var(--light)}.ot7-up .ot7-sun .ot7-rays{animation:ot7-rays .34s ease-out both}@keyframes ot7-rays{from{opacity:.1;transform:rotate(-17deg) scale(.8)}to{opacity:1;transform:rotate(var(--rotate)) scale(1)}}
.ot7-signal{width:37px;height:34px;display:block;overflow:visible}.ot7-signal path{fill:none;stroke:#ededed;stroke-width:3.5;stroke-linecap:round;transition:opacity .2s}.ot7-signal.off path{opacity:.27}.ot7-up .ot7-signal.on path:nth-child(1){animation:ot7-signal .34s both}.ot7-up .ot7-signal.on path:nth-child(2){animation:ot7-signal .34s .08s both}.ot7-up .ot7-signal.on path:nth-child(3){animation:ot7-signal .34s .16s both}@keyframes ot7-signal{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.ot7-peripheral{width:34px;height:35px;display:block;overflow:visible}.ot7-peripheral path,.ot7-peripheral rect{vector-effect:non-scaling-stroke}.ot7-connecting .ot7-peripheral{animation:ot7-dock .5s var(--ease) both}@keyframes ot7-dock{0%{opacity:.45;transform:translateX(5px) scale(.9)}to{opacity:1;transform:translateX(0) scale(1)}}
.ot7-indicator{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:#303030;color:#d8d8d8;flex-shrink:0}.ot7-indicator.ready{color:#bdd5c5;background:#344239;animation:ot7-check .24s var(--ease) both}@keyframes ot7-check{from{opacity:.3;transform:scale(.55)}to{opacity:1;transform:scale(1)}}.ot7-indicator.loading{color:#ddd}.ot7-indicator.loading svg{animation:ot7-turn .8s linear infinite}@keyframes ot7-turn{to{transform:rotate(360deg)}}
.ot7-battery-icon{display:block;width:57px;height:30px;flex-shrink:0}.ot7-battery-icon .ot7-cell{transition:fill .2s}.ot7-charge .ot7-battery-icon .ot7-cell.filled{animation:ot7-cell .36s var(--ease) both}.ot7-charge .ot7-battery-icon .ot7-cell:nth-child(2){animation-delay:.06s}.ot7-charge .ot7-battery-icon .ot7-cell:nth-child(3){animation-delay:.11s}.ot7-charge .ot7-battery-icon .ot7-cell:nth-child(4){animation-delay:.16s}@keyframes ot7-cell{from{opacity:.2;transform:scaleY(.45);transform-origin:center}to{opacity:1;transform:scaleY(1)}}.ot7-alert .ot7-value{color:#ebc28e}.ot7-alert .ot7-battery-icon .ot7-cell.filled{fill:#d7ad79}.ot7-alert.ot7-up{animation:ot7-nudge .3s ease-out both}@keyframes ot7-nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}70%{transform:translateX(2px)}}
.ot7-statusdot{height:6px;width:6px;background:#a6bea9;border-radius:50%;flex-shrink:0}.ot7-statusdot.off{background:#777}
.ot7-hint{position:absolute;bottom:14px;left:16px;right:16px;text-align:center;color:#838d9a;font-size:10px}.ot7-metadata{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:10px;font-size:11px;color:#777}.ot7-metadata strong{color:#292929;font-weight:500;font-variant-numeric:tabular-nums}.ot7-note{margin-top:8px;font-size:11px;color:#777;min-height:16px}
#ot7.reduced *{animation:none!important;transition:none!important}
@media(max-width:480px){#ot7{padding:12px 9px}.ot7-triggers{gap:5px}.ot7-trigger{padding:7px 9px}.ot7-stage{height:220px}.ot7-tools{gap:6px}.ot7-seg button{padding:6px 8px}}
@media(prefers-reduced-motion:reduce){#ot7 *{animation:none!important;transition:none!important}}
</style>
<div id="ot7">
 <div class="ot7-tools"><div class="ot7-toolbar-group"><div class="ot7-seg" aria-label="Placement"><button data-placement="floating" class="active">Floating</button><button data-placement="attached">Attached</button></div><div class="ot7-seg" aria-label="Motion"><button data-motion="fluid" class="active">Fluid</button><button data-motion="reduced">Reduced</button></div></div><div class="ot7-seg" aria-label="Preview lifetime"><button data-lifetime="hold" class="active">Hold preview</button><button data-lifetime="auto">Auto-dismiss</button></div></div>
 <div class="ot7-triggers"><button class="ot7-trigger" data-event="volDown">Vol −</button><button class="ot7-trigger" data-event="volUp">Vol +</button><button class="ot7-trigger" data-event="mute">Mute</button><button class="ot7-trigger" data-event="brightDown">Dim</button><button class="ot7-trigger" data-event="brightUp">Brighten</button><button class="ot7-trigger" data-event="bluetooth">Bluetooth</button><button class="ot7-trigger" data-event="headset">Headset</button><button class="ot7-trigger" data-event="mouse">Mouse</button><button class="ot7-trigger" data-event="wifi">Wi-Fi</button><button class="ot7-trigger" data-event="charging">Charging</button><button class="ot7-trigger" data-event="batteryLow">Low battery</button><button class="ot7-trigger" data-event="reset">Idle</button></div>
 <div class="ot7-stage" id="ot7-stage"><div class="ot7-shell" id="ot7-shell"><svg class="ot7-silhouette" id="ot7-silhouette" aria-hidden="true" preserveAspectRatio="none"><path id="ot7-path" stroke="#353535" stroke-width="1" fill="#151515"/></svg><div class="ot7-viewport"><div class="ot7-content" id="ot7-content"></div></div></div><div class="ot7-hint">Compact-only · no card expansion · context-driven motion</div></div>
 <div class="ot7-metadata"><span id="ot7-state">Idle · Floating</span><strong id="ot7-size">92 × 42 px</strong></div><div class="ot7-note" id="ot7-note">Click an event to inspect its actual capsule layout.</div>
</div>
<script>
(()=>{
const root=document.getElementById('ot7');if(!root||root.dataset.ready)return;root.dataset.ready='1';
const stage=root.querySelector('#ot7-stage'),shell=root.querySelector('#ot7-shell'),content=root.querySelector('#ot7-content'),shape=root.querySelector('#ot7-silhouette'),path=root.querySelector('#ot7-path');
const s={placement:'floating',motion:'fluid',lifetime:'hold',type:null,phase:'',volume:64,mute:false,brightness:68,bt:false,headset:false,mouse:false,wifi:false,charging:false,battery:42,seq:0};
const sizes={idle:[92,42],volume:[192,48],brightness:[160,48],bluetooth:[166,48],headset:[218,52],mouse:[206,52],wifi:[180,48],battery:[172,48]};
const check='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 6"/></svg>';
const spinner='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3a9 9 0 1 1-9 9"/></svg>';
const cross='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5 5 19"/></svg>';
let hide=0,pending=0,frame=0;
const text=(x)=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function volumeArt(){const v=s.mute?0:s.volume;return '<svg class="ot7-wave" viewBox="0 0 34 34"><path d="M3 13h5l7-6v20l-7-6H3z" fill="#ededed"/><path class="ot7-arc" style="--opacity:'+(v>0?1:.1)+'" d="M19 12q6 5 0 10"/><path class="ot7-arc" style="--opacity:'+(v>45?1:.12)+'" d="M23 8q10 9 0 18"/><path class="ot7-arc" style="--opacity:'+(v>78?1:.12)+'" d="M27 5q11 12 0 24"/></svg>'}
function meter(){let heights=[9,17,24,15,21,12];let active=s.mute?0:Math.ceil(s.volume/100*6);return '<span class="ot7-meter" aria-hidden="true">'+heights.map((h,i)=>'<i class="'+(i<active?'lit':'')+'" style="--barH:'+h+'px"></i>').join('')+'</span>'}
function sunArt(){const rays=Array.from({length:8},(_,i)=>{const a=i*Math.PI/4,x1=16.5+Math.cos(a)*11,y1=16.5+Math.sin(a)*11,x2=16.5+Math.cos(a)*14.5,y2=16.5+Math.sin(a)*14.5;return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"/>'}).join('');return '<svg class="ot7-sun" viewBox="0 0 33 33" style="--rotate:'+(s.brightness*.26)+'deg;--light:'+(0.28+s.brightness*.0072)+'"><g class="ot7-rays">'+rays+'</g><circle cx="16.5" cy="16.5" r="7"/></svg>'}
function bluetoothArt(){return '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ededed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m7 7 10 10-5 4V3l5 4L7 17"/></svg>'}
function deviceArt(mouse){if(mouse)return '<svg class="ot7-peripheral" viewBox="0 0 34 36"><defs><linearGradient id="ot7-mouse" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#efefef"/><stop offset="1" stop-color="#9fa2a6"/></linearGradient></defs><rect x="7" y="3" width="20" height="29" rx="10" fill="url(#ot7-mouse)"/><path d="M17 3v13" stroke="#45484b" stroke-width="1.5"/><rect x="15.5" y="9" width="3" height="6" rx="1.5" fill="#47494d"/><path d="M11 27q6 4 12 0" fill="none" stroke="#fff" opacity=".3"/></svg>';return '<svg class="ot7-peripheral" viewBox="0 0 34 36"><defs><linearGradient id="ot7-bud" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#9b9da2"/></linearGradient></defs><g transform="rotate(-13 17 18)"><rect x="10" y="3" width="14" height="17" rx="7" fill="url(#ot7-bud)"/><path d="M17 15v17" stroke="url(#ot7-bud)" stroke-width="6" stroke-linecap="round"/><path d="M17 21v9" stroke="#717477" stroke-width="1.5" stroke-linecap="round"/></g></svg>'}
function wifiArt(){return '<svg class="ot7-signal '+(s.wifi?'on':'off')+'" viewBox="0 0 38 34"><path d="M4 11 Q19 -2 34 11"/><path d="M10 18 Q19 10 28 18"/><path d="M16 26 Q19 23 22 26"/></svg>'}
function batteryArt(){const filled=Math.max(0,Math.ceil(s.battery/100*4));let cells='';for(let i=0;i<4;i++)cells+='<rect class="ot7-cell '+(i<filled?'filled':'')+'" x="'+(7+i*11)+'" y="10" width="8" height="14" rx="2.5" fill="'+(i<filled?(s.battery<16?'#d7ad79':'#e6e6e6'):'#404040')+'"/>';return '<svg class="ot7-battery-icon" viewBox="0 0 57 34" aria-label="Battery '+s.battery+' percent"><rect x="2" y="5" width="49" height="24" rx="8" stroke="#858585" stroke-width="1.5" fill="#252525"/><rect x="51" y="12" width="4" height="10" rx="1.5" fill="#777"/>'+cells+(s.charging?'<path d="m29 7-7 10h6l-3 10 10-13h-6l2-7z" fill="#bdd9c6" stroke="#202a23" stroke-width="1"/>':'')+'</svg>'}
function statusMarkup(){return s.phase==='connecting'?'<span class="ot7-indicator loading">'+spinner+'</span>':s.phase==='connected'?'<span class="ot7-indicator ready">'+check+'</span>':s.phase==='off'?'<span class="ot7-indicator">'+cross+'</span>':''}
function renderMarkup(){
 if(!s.type)return '<span class="ot7-eyes"><i></i><i></i></span>';
 const entering='ot7-up',pairClass=s.phase==='connecting'?'ot7-connecting':'';
 if(s.type==='volume')return '<div class="ot7-row '+entering+'"><span class="ot7-left">'+volumeArt()+'</span>'+meter()+'<span class="ot7-value">'+(s.mute?'—':s.volume+'<small>%</small>')+'</span></div>';
 if(s.type==='brightness')return '<div class="ot7-row '+entering+'"><span class="ot7-left">'+sunArt()+'</span><span style="flex:1"></span><span class="ot7-value">'+s.brightness+'<small>%</small></span></div>';
 if(s.type==='bluetooth')return '<div class="ot7-row"><span class="ot7-iconwrap">'+bluetoothArt()+'</span><span class="ot7-secondary">Bluetooth</span><span class="ot7-statusdot '+(!s.bt?'off':'')+'"></span></div>';
 if(s.type==='headset'||s.type==='mouse')return '<div class="ot7-row '+pairClass+'"><span class="ot7-left">'+deviceArt(s.type==='mouse')+'</span><span class="ot7-secondary">'+(s.type==='mouse'?'Mouse':'Headphones')+'<div class="ot7-smalltext">'+(s.phase==='connecting'?'Connecting…':s.phase==='connected'?'Connected':'Disconnected')+'</div></span>'+statusMarkup()+'</div>';
 if(s.type==='wifi')return '<div class="ot7-row ot7-up"><span class="ot7-left">'+wifiArt()+'</span><span class="ot7-secondary">'+(s.phase==='connecting'?'Connecting…':s.wifi?'Connected':'Disconnected')+'</span>'+statusMarkup()+'</div>';
 if(s.type==='battery')return '<div class="ot7-row '+(s.charging?'ot7-charge ':'')+(s.battery<16?'ot7-alert ot7-up':'')+'"><span style="flex:1">'+batteryArt()+'</span><span class="ot7-value">'+s.battery+'<small>%</small></span></div>';
 return '';
}
function updateSilhouette(){if(s.placement!=='attached')return;const w=shell.getBoundingClientRect().width,h=shell.getBoundingClientRect().height;if(w<35)return;const L=12,R=w-12,r=Math.min(h*.55,h-12,(w-24)*.35);const d='M0 0 C8 0 12 5 12 12 L12 '+(h-r)+' C12 '+(h-r*.45)+' '+(12+r*.45)+' '+h+' '+(12+r)+' '+h+' L'+(R-r)+' '+h+' C'+(R-r*.45)+' '+h+' '+R+' '+(h-r*.45)+' '+R+' '+(h-r)+' L'+R+' 12 C'+R+' 5 '+(w-8)+' 0 '+w+' 0 Z';shape.setAttribute('viewBox','0 0 '+w+' '+h);path.setAttribute('d',d)}
function animateSilhouette(){cancelAnimationFrame(frame);let start=performance.now();function f(now){updateSilhouette();if(now-start<430)frame=requestAnimationFrame(f)}frame=requestAnimationFrame(f)}
function render(){const [w,h]=sizes[s.type||'idle'],outer=w+(s.placement==='attached'?24:0);shell.style.setProperty('--w',outer+'px');shell.style.setProperty('--h',h+'px');stage.classList.toggle('attached',s.placement==='attached');root.classList.toggle('reduced',s.motion==='reduced');root.querySelector('#ot7-state').textContent=(s.type||'Idle')+' · '+s.placement;root.querySelector('#ot7-size').textContent=outer+' × '+h+' px';root.querySelectorAll('[data-placement]').forEach(b=>b.classList.toggle('active',b.dataset.placement===s.placement));root.querySelectorAll('[data-motion]').forEach(b=>b.classList.toggle('active',b.dataset.motion===s.motion));root.querySelectorAll('[data-lifetime]').forEach(b=>b.classList.toggle('active',b.dataset.lifetime===s.lifetime));content.innerHTML=renderMarkup();animateSilhouette();}
function autoDismiss(){clearTimeout(hide);if(s.lifetime==='hold'||!s.type)return;hide=setTimeout(()=>{s.type=null;render()},s.battery<16&&s.type==='battery'?4700:2700)}
function send(type,phase=''){s.seq++;clearTimeout(pending);s.type=type;s.phase=phase;render();autoDismiss()}
function showMessage(m){root.querySelector('#ot7-note').textContent=m}
function trigger(k){clearTimeout(pending);if(k==='reset'){send(null);showMessage('Returned to eyes-only Idle.');return}
 if(k==='volUp'||k==='volDown'){s.volume=Math.max(0,Math.min(100,s.volume+(k==='volUp'?8:-8)));s.mute=false;send('volume');showMessage('Wave and meter respond to the actual level; repeated changes update in place.');return}
 if(k==='mute'){s.mute=!s.mute;send('volume');showMessage('Muted state removes visible acoustic energy.');return}
 if(k==='brightUp'||k==='brightDown'){s.brightness=Math.max(0,Math.min(100,s.brightness+(k==='brightUp'?12:-12)));send('brightness');showMessage('Short aperture motion, then stable brightness.');return}
 if(k==='bluetooth'){s.bt=!s.bt;send('bluetooth');showMessage('Bluetooth radio state is separate from connected devices.');return}
 if(k==='headset'||k==='mouse'){s.bt=true;s[k]=!s[k];const target=s[k];send(k,target?'connecting':'off');let version=s.seq;showMessage('Small device silhouette shifts into place; no giant product render.');if(target)pending=setTimeout(()=>{if(version!==s.seq)return;s.phase='connected';render();autoDismiss();showMessage('Connected — final state confirmed (simulated).')},750);return}
 if(k==='wifi'){s.wifi=!s.wifi;send('wifi',s.wifi?'connecting':'off');let version=s.seq;showMessage('Three signal arcs reveal in sequence, not an animated laptop.');if(s.wifi)pending=setTimeout(()=>{if(version!==s.seq)return;s.phase='connected';render();autoDismiss()},650);return}
 if(k==='charging'){s.charging=!s.charging;send('battery');showMessage(s.charging?'One energy-fill cue; percentage changes only when reported.':'Charging disconnected.');return}
 if(k==='batteryLow'){s.battery=9;s.charging=false;send('battery');showMessage('Low battery: amber and a single 2px nudge, no repeated shaking.');return}
}
root.addEventListener('click',e=>{const el=e.target.closest('[data-event],[data-placement],[data-motion],[data-lifetime]');if(!el)return;if(el.dataset.event){trigger(el.dataset.event);return}if(el.dataset.placement)s.placement=el.dataset.placement;if(el.dataset.motion)s.motion=el.dataset.motion;if(el.dataset.lifetime)s.lifetime=el.dataset.lifetime;render();autoDismiss()});window.addEventListener('resize',animateSilhouette);render();
})();
</script></html>
