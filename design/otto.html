<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otto — Unified UI & Motion</title>
<meta name="color-scheme" content="dark">
<!-- Single-file design laboratory: React 19 + the real lucide-react icon components.
     The import map requires network access. This is not a production Tauri entry. -->
<script type="importmap">
{"imports":{
"react":"https://esm.sh/react@19.2.4",
"react-dom/client":"https://esm.sh/react-dom@19.2.4/client?external=react",
"lucide-react":"https://esm.sh/lucide-react@1.66.0?external=react"
}}
</script>
<style>
:root{color-scheme:dark;--base:#101114;--rail:#16171a;--canvas:#1a1c22;--panel:#24262b;--line:#303238;--line2:#3c3e45;--text:#f2f2f3;--secondary:#a5a6af;--subtle:#767880;--white:#eaeaec;--ease:cubic-bezier(.22,1,.36,1);--soft:cubic-bezier(.25,.8,.25,1);font-family:Inter,"Segoe UI Variable","Segoe UI",system-ui,sans-serif;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;background:#0d0e11;color:var(--text);font-size:12px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #98accb;outline-offset:3px}
button{touch-action:manipulation}
#root{min-height:100vh}
.lab{min-height:100vh;display:grid;grid-template-columns:232px minmax(0,1fr);max-width:1900px;margin:0 auto}
.rail{min-height:100vh;padding:28px 16px 20px;background:var(--rail);border-right:1px solid #292a2f;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:10px;align-items:center;padding:0 7px}
.brand-logo{width:34px;height:34px;background:#e9e9eb;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#1c1d21;font-size:20px;font-weight:650;letter-spacing:-2px}
.brand strong{display:block;font-size:16px;letter-spacing:-.7px;font-weight:650}
.brand small{color:var(--subtle);font-size:10px}
.label{font-size:11px;color:#81838c;margin:0 0 8px 9px}
.rail-group{display:flex;flex-direction:column;gap:3px}
.nav{display:flex;align-items:center;gap:11px;color:#a7a8af;background:transparent;border:1px solid transparent;border-radius:9px;width:100%;height:35px;text-align:left;padding:0 10px;transition:background 160ms ease,color 160ms ease,border-color 160ms ease}
.nav svg{flex:none;opacity:.78}
.nav:hover{background:#26282d;color:#fff}
.nav.active{background:#2d2f35;color:#f2f3f5;border-color:#3a3b43}
.nav.active svg{opacity:1}
.nav small{margin-left:auto;font-size:10px;color:#898b93}
.rail-rule{height:1px;background:#2b2d32}
.segment{display:flex;padding:3px;gap:2px;background:#22242a;border-radius:10px}
.segment button{flex:1;border:0;border-radius:8px;color:#a0a1a9;padding:8px 5px;background:transparent;transition:background .16s ease,color .16s ease;font-size:11px}
.segment button.selected{background:#3d3f47;color:#fff}
.rail-footer{margin-top:auto;color:#95969d;font-size:11px;line-height:1.65}
.rail-footer strong{display:block;color:#cfd0d4;margin-bottom:6px;font-weight:550}
.rail-footer span{display:block}
.main{min-width:0;display:flex;flex-direction:column}
.top{height:79px;flex:none;border-bottom:1px solid #25262b;padding:17px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.top-title{font-size:17px;letter-spacing:-.4px;font-weight:550}
.top-desc{color:#878993;font-size:11px;margin-top:4px}
.top-status{display:flex;align-items:center;gap:7px;color:#a5a6ae;font-size:10px;border:1px solid #363840;border-radius:999px;padding:6px 10px;white-space:nowrap}
.status-dot{width:6px;height:6px;background:#95b8a1;border-radius:50%}
.content{padding:25px 30px 28px;min-height:0;display:flex;flex-direction:column;flex:1;gap:14px}
.canvas{position:relative;min-height:480px;flex:1;overflow:hidden;background:linear-gradient(140deg,#30323a 0%,#1e2028 44%,#16171d 100%);border:1px solid #3c3d45;border-radius:19px}
.canvas:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.012) 50%,transparent 100%)}
.desktop-bar{height:29px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#ffffff08;border-bottom:1px solid #ffffff0b;color:#989aa5;font-size:10px;letter-spacing:.1px}
.desktop-window{position:absolute;border:1px solid #40424a;background:#23252e;border-radius:12px;box-shadow:0 16px 40px #07080a28;overflow:hidden;opacity:.66;pointer-events:none}
.desktop-window.one{left:9%;top:145px;width:31%;height:245px;transform:rotate(-4deg)}
.desktop-window.two{right:7%;top:183px;width:29%;height:208px;transform:rotate(4deg)}
.win-top{height:28px;border-bottom:1px solid #373941;padding:0 13px;display:flex;gap:6px;align-items:center}
.win-top span{width:6px;height:6px;border-radius:50%;border:1px solid #555760}
.win-content{padding:17px 13px}
.win-line{height:6px;border-radius:9px;background:#3f424b;margin:0 0 15px}
.win-line:nth-child(2n){width:73%}
.win-line:nth-child(3n){width:52%}
.canvas-note{position:absolute;bottom:20px;left:20px;color:#92949f;font-size:10px;display:flex;align-items:center;gap:8px;z-index:1}
.canvas-note kbd,.keycap{border:1px solid #4b4d55;border-radius:4px;font:10px "Cascadia Code",monospace;padding:2px 5px;color:#bdc0c9}
.corner-note{position:absolute;bottom:20px;right:20px;color:#777b87;font-size:10px;z-index:1}
.mount{position:absolute;left:50%;top:0;transform:translateX(-50%);z-index:10;display:flex;justify-content:center;width:100%;pointer-events:none}
.notch{position:relative;pointer-events:auto;background:#0e0f10;border:1px solid #34363c;border-radius:var(--rad,999px);width:var(--w,92px);height:var(--h,42px);overflow:visible;isolation:isolate;box-shadow:0 14px 39px #0007,inset 0 1px 0 #ffffff1b;transition:width 470ms var(--ease),height 470ms var(--ease),border-radius 470ms var(--ease),box-shadow 200ms ease;will-change:width,height}
.notch.attached{border-radius:0 0 24px 24px;border-top-color:transparent}
.notch.attached:before,.notch.attached:after{content:"";position:absolute;top:-1px;width:14px;height:14px;pointer-events:none}
.notch.attached:before{right:100%;background:radial-gradient(circle at 0 100%,transparent 13.5px,#0e0f10 14px)}
.notch.attached:after{left:100%;background:radial-gradient(circle at 100% 100%,transparent 13.5px,#0e0f10 14px)}
.notch-clip{width:100%;height:100%;border-radius:inherit;overflow:hidden;contain:paint}
.notch-content{height:100%;animation:reveal 260ms var(--ease) both;animation-delay:85ms}
@keyframes reveal{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.eye-pair{width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:17px;border:0;background:transparent;color:inherit}
.eye{height:14px;width:10px;border-radius:50%;background:#f2f2f3;transition:height 190ms var(--ease),width 190ms var(--ease),transform 190ms var(--ease)}
.eye-pair:hover .eye{height:12px;width:11px;transform:translateY(-1px)}
.compact{height:100%;padding:0 11px;display:flex;align-items:center;gap:9px;border:0;background:none;color:inherit;width:100%;text-align:left}
.compact-identity{flex:1;min-width:0}
.compact strong{display:block;font-size:12px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compact small{color:#9598a1;font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compact-icon{width:28px;height:28px;border-radius:50%;background:#292b31;flex:none;display:grid;place-items:center;color:#e6e7ea}
.album-mini{border-radius:50%;background:linear-gradient(140deg,#8394a9,#334860)}
.activity{display:flex;align-items:center;height:19px;gap:3px;margin-left:auto}
.activity i{width:3px;height:5px;border-radius:3px;background:#c6c7cb}
.activity.playing i:nth-child(1){animation:levels 720ms ease-in-out infinite alternate}
.activity.playing i:nth-child(2){animation:levels 520ms ease-in-out 90ms infinite alternate}
.activity.playing i:nth-child(3){animation:levels 870ms ease-in-out 130ms infinite alternate}
@keyframes levels{to{height:15px}}
.unread{width:6px;height:6px;border-radius:50%;background:#b4c6de;flex:none}
.panel{width:100%;height:100%;padding:13px 17px;display:flex;flex-direction:column;min-height:0}
.panel-head{display:flex;align-items:center;gap:9px;height:27px;flex:none}
.panel-head strong{font-size:12px;font-weight:600}
.panel-head .context{font-size:10px;color:#989aa3;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel-head .head-actions{display:flex;margin-left:auto;align-items:center;gap:2px}
.icon-button{width:27px;height:27px;border:0;background:transparent;color:#a8aab2;display:grid;place-items:center;border-radius:50%;flex:none;transition:background 150ms ease,color 150ms ease,transform 150ms ease}
.icon-button:hover{background:#2c2e34;color:#fff}
.icon-button:active{transform:scale(.95)}
.primary{border:0;border-radius:999px;background:#e8e9ea;color:#151617;padding:7px 11px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;font-size:11px;font-weight:550;transition:background 170ms ease,transform 170ms ease}
.primary:hover{background:#fff}.primary:active{transform:scale(.98)}
.secondary-button{border:1px solid #41434b;border-radius:999px;background:#282a30;color:#dedee2;padding:6px 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:11px;transition:background 160ms ease}
.secondary-button:hover{background:#383a41}
.muted{color:#9698a2}.small{font-size:10px}.mono{font-variant-numeric:tabular-nums}
.home-panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;flex:1;min-height:0;margin-top:8px}
.module{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;text-align:left;padding:10px 12px;border:1px solid #43454a;border-radius:14px;overflow:hidden;color:#f3f3f5;background:linear-gradient(132deg,#3f4148,#26282e);transition:border-color 180ms ease,background 180ms ease}
.module.agent{background:linear-gradient(135deg,#414249,#24252a)}
.module.music{background:linear-gradient(135deg,#3c4851,#222b34)}
.module.focus{background:linear-gradient(135deg,#464150,#292530)}
.module:hover{border-color:#676974}
.module-art{position:absolute;right:-4px;top:-25px;opacity:.38;transform:rotate(-43deg);transition:transform 350ms var(--ease),opacity 250ms ease;pointer-events:none}
.module-art svg{width:91px;height:91px;stroke-width:1.15}
.module:hover .module-art{transform:rotate(-39deg) translate(-3px,2px);opacity:.47}
.module strong{position:relative;font-size:12px;font-weight:600}
.module small{position:relative;font-size:10px;color:#bdc0c8;margin-top:1px}
.agent-feed{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:#505158 transparent;padding:8px 2px 2px}
.agent-empty{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#91939d;font-size:11px;text-align:center}
.agent-empty svg{opacity:.6}
.bubble{font-size:11px;line-height:1.55;padding:7px 9px;border-radius:12px;background:#292b30;margin:3px 0 8px 48px;color:#dbdce0}
.reply{font-size:11px;line-height:1.6;color:#e5e5e7;margin:5px 2px 12px}
.reply.pending{color:#aeb1b9}
.compose{flex:none;display:flex;align-items:center;gap:5px;border:1px solid #4c4e55;background:#282a30;border-radius:22px;margin-top:7px;padding:4px 5px}
.compose input{min-width:0;flex:1;background:transparent;border:0;color:#fff;font-size:11px;outline:0;padding:3px 1px}
.compose input::placeholder{color:#858891}
.compose .primary{width:29px;height:29px;padding:0}
.status-banner{margin:5px 0 2px;padding:6px 9px;background:#292c32;border:1px solid #34383e;border-radius:8px;font-size:10px;color:#d0d1d5}
.status-banner.warning{background:#322d2a;border-color:#4a3c34;color:#e8c7ac}
.album{width:96px;height:96px;flex:none;border-radius:17px;background:linear-gradient(150deg,#8e9cae,#526883 48%,#273748);display:grid;place-items:center;overflow:hidden}
.album svg{width:45px;height:45px;stroke-width:1.1;opacity:.6;transform:rotate(-20deg)}
.music-layout{flex:1;min-height:0;display:flex;gap:15px;align-items:center;padding-top:9px}
.music-info{min-width:0;flex:1}
.track-title{font-size:15px;font-weight:600;letter-spacing:-.3px;margin:0 0 1px}
.track-artist{color:#a4a5ad;font-size:11px}
.seek{display:block;width:100%;accent-color:#e8e8e9;margin:13px 0 3px;height:4px;cursor:pointer}
.time-labels{display:flex;justify-content:space-between;color:#888a94;font-size:10px;font-variant-numeric:tabular-nums}
.controls{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.controls .primary{width:30px;height:30px;padding:0}
.lyrics-layout{flex:1;min-height:0;display:grid;grid-template-columns:1fr 3fr;gap:12px;padding-top:11px}
.lyrics-layout .album{width:100%;aspect-ratio:1;height:auto;max-width:95px}
.lyrics-column{overflow:auto;scrollbar-width:thin;scrollbar-color:#44464d transparent;padding-right:5px}
.lyric{display:block;width:100%;text-align:left;border:0;background:none;color:#777984;padding:5px 0;font-size:12px;font-weight:550}
.lyric.active{color:#fafafb}
.lyric:hover{color:#d8d9de}
.timer-layout{display:flex;align-items:center;justify-content:space-between;gap:16px;flex:1;min-height:0}
.timer-phase{font-size:11px;color:#9e9fa7;margin-bottom:2px}
.timer-time{font-variant-numeric:tabular-nums;font-size:39px;line-height:1.1;font-weight:520;letter-spacing:-2px}
.phase-row{display:flex;gap:5px;padding-top:7px}
.phase-row button{border:1px solid #3b3d43;border-radius:999px;color:#a8a9b1;background:#23252a;font-size:10px;padding:5px 9px}
.phase-row button.active{color:#fff;background:#42444b}
.setting-body{flex:1;min-height:0;overflow:auto;padding:9px 1px 2px;scrollbar-width:thin}
.setting-line{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #292b30;padding:9px 0;font-size:11px}
.setting-line span{color:#adb0b9}
.setting-line input,.setting-line select{max-width:60%;padding:6px 8px;border:1px solid #42444a;border-radius:8px;background:#292b30;color:#fff;font-size:10px;min-width:0}
.setting-line input[type=range]{padding:0;accent-color:#e3e3e7}
.setting-tabs{display:flex;gap:4px;margin:8px 0 4px}
.setting-tabs button{font-size:10px;border:1px solid #34363d;border-radius:8px;background:#24262c;color:#9e9fa8;padding:6px 9px}
.setting-tabs button.active{background:#3c3e45;color:#fff}
.choice{display:flex;gap:4px;align-items:center}
.choice button{font-size:10px;border:1px solid #45474d;border-radius:8px;background:#2b2d32;color:#c2c3c8;padding:5px 8px}
.choice button.selected{background:#ededee;color:#18191c;border-color:transparent}
.event-content{height:100%;display:flex;align-items:center;gap:11px;padding:0 13px}
.event-content strong{display:block;font-size:11px;font-weight:600}
.event-content small{color:#a4a7b0;font-size:10px}
.micro-meter{margin-left:auto;display:flex;align-items:flex-end;gap:3px;height:19px}
.micro-meter i{width:3px;background:#e1e2e5;border-radius:3px;animation:meter 260ms var(--ease) both}
.micro-meter i:nth-child(1){height:6px}.micro-meter i:nth-child(2){height:11px;animation-delay:30ms}.micro-meter i:nth-child(3){height:15px;animation-delay:60ms}.micro-meter i:nth-child(4){height:9px;animation-delay:90ms}.micro-meter i:nth-child(5){height:5px;animation-delay:120ms}
@keyframes meter{from{transform:scaleY(.1)}to{transform:scaleY(1)}}
.bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;flex:none}
.study-panel{min-width:0;border:1px solid #34363d;border-radius:14px;background:#181a1f;padding:14px 16px}
.study-head{font-size:12px;font-weight:600;margin-bottom:10px}
.event-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.event-actions button{border:1px solid #3b3d44;border-radius:8px;background:#26282d;color:#b6b8c1;display:flex;align-items:center;gap:7px;padding:7px 10px;font-size:10px;transition:background 140ms ease}
.event-actions button:hover{background:#36383e}
.graph{color:#9b9da6;font-size:11px;line-height:1.8}
.graph strong{color:#e1e2e5;font-weight:550}
.graph svg{vertical-align:middle;color:#777983}
.footnote{color:#7d7e87;font-size:10px;margin-top:2px}
@media(max-width:1050px){.lab{grid-template-columns:185px minmax(0,1fr)}.rail{padding:22px 11px}.content{padding:18px}.bottom{grid-template-columns:1fr}.canvas{min-height:460px}}
@media(max-width:690px){.lab{display:block}.rail{min-height:0;flex-direction:row;flex-wrap:wrap;gap:8px;padding:12px}.rail .brand{width:100%}.rail .rail-group{flex-direction:row;flex-wrap:wrap}.rail .nav{width:auto}.rail .rail-footer,.rail .rail-rule,.rail .segment,.rail .label{display:none}.top{padding:12px 16px;height:70px}.top-status{display:none}.content{padding:10px}.canvas{min-height:460px}.notch{transform:scale(.8);transform-origin:top center}.corner-note{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition-duration:0.01ms!important;scroll-behavior:auto!important}.notch{will-change:auto}}
.motion-reduced .notch,.motion-reduced .notch-content,.motion-reduced .module-art,.motion-reduced .eye,.motion-reduced .micro-meter i{transition:none!important;animation:none!important}

/* Home + Agent fidelity pass: references design/home.html and design/agent.html */
.desktop{background:#e9ecf1;border-color:#d5dbe3}
.desktop:before{background:radial-gradient(ellipse 360px 230px at 75% 75%,#dce1e9,transparent 100%)}
.desktop-top{background:transparent;border-color:transparent;color:#a0a9b5}
.window{background:#fafbfdc9;border-color:#d2d8e0;opacity:.82;box-shadow:0 12px 35px #64728416}
.win-top{border-color:#e0e4ea}.win-top span{border-color:#c2c7ce}.win-line{background:#e0e4ea}
.canvas-note,.corner-note{color:#9ba5b2}.canvas-note kbd{border-color:#aeb9c6;color:#8996a8}
.notch{background:#151515;border-color:#353535;box-shadow:0 14px 28px #25344924}
.notch.attached:before{background:radial-gradient(circle at 0 100%,transparent 13.5px,#151515 14px)}
.notch.attached:after{background:radial-gradient(circle at 100% 100%,transparent 13.5px,#151515 14px)}
.hf{padding:12px 17px 17px}
.hf-head{height:26px;display:flex;gap:9px;align-items:center;flex:none}
.hf-head strong{font-size:13px;font-weight:520;letter-spacing:-.01em}
.hf-eyes{width:28px;height:23px;display:flex;align-items:center;justify-content:center;gap:8px}
.hf-eyes i{height:13px;width:6px;border-radius:6px;background:#fafafa}
.hf-head .icon-button{width:28px;height:28px;border-radius:9px}
.home-panels{margin-top:8px;gap:9px}
.module{height:76px;min-height:0;display:flex;align-items:center;justify-content:space-between;text-align:left;padding:11px 10px 11px 13px;border:1px solid #373737;border-radius:15px;background:#262626;position:relative;overflow:hidden;transition:background 160ms,border-color 160ms}
.module.agent-card{background:linear-gradient(118deg,#26292e 0%,#262a30 51%,#1c2128 100%)}
.module.music-card{background:linear-gradient(118deg,#29282d 0%,#282730 51%,#1d1e29 100%)}
.module.focus-card{background:linear-gradient(118deg,#28292c 0%,#27282c 51%,#202329 100%)}
.module:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse 120px 98px at 78% 25%,#bccfe039,transparent 72%)}
.module:after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,#292a2edb 0%,#27292cb0 29%,#27292c28 64%,transparent 100%)}
.module:hover{border-color:#535353}
.hf-copy{position:relative;z-index:2;display:flex;flex-direction:column;gap:6px;white-space:nowrap}
.hf-copy strong{font-size:12px;color:#f5f5f5;font-weight:550}
.hf-copy small{font-size:10px;color:#aaaeb4;margin:0}
.module-art{position:absolute;right:-7px;top:-23px;height:132px;width:148px;z-index:0;opacity:.9;transform:perspective(380px) rotateY(-43deg) rotateZ(-6deg);transform-origin:60% 50%;transition:transform 370ms var(--ease),opacity 240ms ease}
.module-art svg{width:100%;height:100%;stroke-width:initial}
.module:hover .module-art{transform:perspective(380px) rotateY(-39deg) rotateZ(-5deg) translate3d(-3px,2px,0);opacity:1}
.af{height:100%;width:100%;display:flex;flex-direction:column;min-height:0}
.af-head{height:53px;padding:9px 15px 5px;display:flex;align-items:center;gap:9px;flex:none}
.af-eyebutton{width:34px;height:34px;background:#29292c;border:0;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:6px;flex:none}
.af-eyebutton i{height:12px;width:5px;background:#f4f4f4;border-radius:7px}
.af-eyebutton:hover{background:#37373a}
.af-identity{min-width:0;flex:1}
