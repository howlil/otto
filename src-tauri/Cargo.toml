[package]
name = "otto"
version = "1.0.0"
description = "Otto desktop companion"
edition = "2024"
build = "build.rs"

[lib]
name = "otto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
png = "0.18"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGDisplayConfiguration", "CGDirectDisplay", "CGError"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSScreen", "NSWindow", "NSResponder", "objc2-core-foundation"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-updater = "2"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Accessibility"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
