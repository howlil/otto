[package]
name = "otto"
version = "0.1.0"
description = "Otto desktop companion"
edition = "2024"
build = "build.rs"

[lib]
name = "otto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
