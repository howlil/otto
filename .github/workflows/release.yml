name: Otto Release

'on':
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: otto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Plan immutable release version
        id: version
        run: bun scripts/release-version.mjs plan
      - name: Install frontend dependencies
        if: steps.version.outputs.publish == 'true'
        run: bun install --frozen-lockfile
      - name: Verify frontend
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          bun run check
          bun run build
          bun run test:frontend:critical
      - name: Verify Rust
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --manifest-path src-tauri/Cargo.toml --locked
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Stamp installer version
        if: steps.version.outputs.publish == 'true'
        run: bun scripts/release-version.mjs stamp ${{ steps.version.outputs.version }}
      - name: Build Windows NSIS installer
        if: steps.version.outputs.publish == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bun run tauri build --bundles nsis
      - name: Validate installer and checksum
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $installer = $installers[0]
          if ($installer.Length -lt 1024) { throw 'Installer is unexpectedly small' }
          $signaturePath = $installer.FullName + '.sig'
          if (-not (Test-Path -LiteralPath $signaturePath)) { throw 'Updater signature is missing' }
          $signature = (Get-Content -LiteralPath $signaturePath -Raw).Trim()
          if (-not $signature) { throw 'Updater signature is empty' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Path SHA256SUMS.txt -Encoding utf8
          $manifest = [ordered]@{
            version = $env:VERSION
            notes = "Otto $env:VERSION"
            pub_date = (Get-Date).ToUniversalTime().ToString('o')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = $signature
                url = "https://github.com/howlil/otto/releases/download/v$env:VERSION/$($installer.Name)"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path latest.json -Encoding utf8NoBOM
      - name: Retain release artifact
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: otto-windows-${{ steps.version.outputs.version }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            latest.json
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub prerelease
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          $tag = "v$env:VERSION"
          if (git tag --list $tag) { throw "Release tag $tag already exists" }
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File)
          $signature = $installers[0].FullName + '.sig'
          $args = @('release', 'create', $tag, $installers[0].FullName, $signature, 'latest.json', 'SHA256SUMS.txt', '--target', $env:GITHUB_SHA, '--title', "Otto $tag", '--generate-notes', '--prerelease')
          if ($env:PREVIOUS_TAG) { $args += @('--notes-start-tag', $env:PREVIOUS_TAG) }
          gh @args
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }
