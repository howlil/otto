name: Otto Windows verification (on demand)

'on':
  push:
    branches:
      - feat/tauri-foundation
    paths:
      - .github/workflows/otto-verify-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: otto-windows-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Resolve frontend dependencies
        run: bun install
      - name: Apply frontend formatting
        run: bun run format
      - name: TypeScript and frontend build
        id: frontend
        continue-on-error: true
        run: bun run build
      - name: Biome lint and formatting
        id: lint
        continue-on-error: true
        run: bun run check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply Rust formatting
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml
      - name: Rust format
        id: rustfmt
        continue-on-error: true
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
      - name: Cargo compile check
        id: cargo
        continue-on-error: true
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Cargo targeted tests
        id: tests
        continue-on-error: true
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Commit formatter output after passing checks
        if: ${{ steps.frontend.outcome == 'success' && steps.lint.outcome == 'success' && steps.rustfmt.outcome == 'success' && steps.cargo.outcome == 'success' && steps.tests.outcome == 'success' && steps.clippy.outcome == 'success' }}
        shell: pwsh
        run: |
          git add -- src src-tauri/src vite.config.ts
          $changed = git diff --cached --name-only
          if ($changed) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: apply Biome and rustfmt verified by Windows runner"
            git push origin HEAD:feat/tauri-foundation
          }
      - name: Fail if any verification failed
        if: always()
        shell: pwsh
        env:
          FRONTEND: ${{ steps.frontend.outcome }}
          LINT: ${{ steps.lint.outcome }}
          RUSTFMT: ${{ steps.rustfmt.outcome }}
          CARGO: ${{ steps.cargo.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
        run: |
          $failed = @()
          foreach ($name in @("FRONTEND", "LINT", "RUSTFMT", "CARGO", "TESTS", "CLIPPY")) {
            if ([Environment]::GetEnvironmentVariable($name) -ne "success") {
              $failed += $name
            }
          }
          if ($failed.Count -gt 0) { throw ("Verification failed: " + ($failed -join ", ")) }
