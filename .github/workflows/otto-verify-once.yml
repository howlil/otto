name: Otto CI

'on':
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: otto-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript and frontend build
        run: bun run build
      - name: Biome lint and formatting
        run: bun run check
      - name: Frontend and release policy tests
        run: bun run test:frontend:critical
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust format
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
      - name: Inspect Cargo lock delta
        run: |
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 | Out-Null
          git diff -- src-tauri/Cargo.lock
      - name: Diagnose generated Cargo.lock delta
        run: |
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 | Out-Null
          git diff -- src-tauri/Cargo.lock
      - name: Cargo compile check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Cargo targeted tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
