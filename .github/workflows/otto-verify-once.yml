name: Otto Windows verification (on demand)
# Run only on deliberate workflow updates in feature branches, or manual dispatch. No per-source-push CI.
# Verification dispatch: X10 minimal interrupted-session recovery marker.

'on':
  push:
    branches:
      - 'feat/*'
      - master
    paths:
      - .github/workflows/otto-verify-once.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: otto-windows-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Resolve frontend dependencies
        run: bun install
      - name: TypeScript and frontend build
        run: bun run build
      - name: Biome lint and formatting
        run: bun run check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust format
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
      - name: Cargo compile check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Cargo targeted tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
