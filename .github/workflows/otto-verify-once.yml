name: Otto CI

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      suite:
        description: Verification depth
        required: true
        default: full
        type: choice
        options:
          - fast
          - full

permissions:
  contents: read

concurrency:
  group: otto-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OTTO_SUITE: ${{ inputs.suite || 'fast' }}

jobs:
  changes:
    name: Change scope detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      frontend_check: ${{ steps.filter.outputs.frontend_check }}
      frontend_build: ${{ steps.filter.outputs.frontend_build }}
      frontend_all: ${{ steps.filter.outputs.frontend_all }}
      bun_tests: ${{ steps.filter.outputs.bun_tests }}
      node_tests: ${{ steps.filter.outputs.node_tests }}
      rust: ${{ steps.filter.outputs.rust }}
      rust_lint: ${{ steps.filter.outputs.rust_lint }}
      rust_all: ${{ steps.filter.outputs.rust_all }}
      rust_filters: ${{ steps.filter.outputs.rust_filters }}
      native: ${{ steps.filter.outputs.native }}
      native_shell: ${{ steps.filter.outputs.native_shell }}
      native_transitions: ${{ steps.filter.outputs.native_transitions }}
      native_p8: ${{ steps.filter.outputs.native_p8 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect affected verification scopes
        id: filter
        shell: bash
        env:
          OTTO_SUITE: ${{ inputs.suite || 'fast' }}
          OTTO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$OTTO_SUITE" = "full" ]; then
            node scripts/test-affected.mjs --full --github-output
          else
            base="$OTTO_BASE_SHA"
            if [ -z "$base" ]; then base="origin/master"; fi
            node scripts/test-affected.mjs --base "$base" --github-output
          fi

  frontend:
    name: Frontend and contract gate
    needs: changes
    if: ${{ inputs.suite == 'full' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint and frontend rules
        if: ${{ inputs.suite == 'full' || needs.changes.outputs.frontend_check == 'true' }}
        run: bun run check
      - name: TypeScript and Vite build
        if: ${{ inputs.suite == 'full' || needs.changes.outputs.frontend_build == 'true' }}
        run: bun run build
      - name: Frontend and CLI contract tests
        if: ${{ inputs.suite == 'full' || needs.changes.outputs.frontend_all == 'true' || needs.changes.outputs.bun_tests != '' || needs.changes.outputs.node_tests != '' }}
        env:
          OTTO_SUITE: ${{ inputs.suite || 'fast' }}
          OTTO_FRONTEND_ALL: ${{ needs.changes.outputs.frontend_all }}
          OTTO_BUN_TESTS: ${{ needs.changes.outputs.bun_tests }}
          OTTO_NODE_TESTS: ${{ needs.changes.outputs.node_tests }}
        shell: bash
        run: |
          if [ "$OTTO_SUITE" = "full" ] || [ "$OTTO_FRONTEND_ALL" = "true" ]; then
            bun run test:frontend:critical
          else
            if [ -n "$OTTO_BUN_TESTS" ]; then
              read -r -a bun_files <<< "$OTTO_BUN_TESTS"
              bun test --isolate "${bun_files[@]}"
            fi
            if [ -n "$OTTO_NODE_TESTS" ]; then
              read -r -a node_files <<< "$OTTO_NODE_TESTS"
              node --test "${node_files[@]}"
            fi
          fi

  windows:
    name: Windows Rust and contract gate
    needs: changes
    if: ${{ inputs.suite == 'full' || needs.changes.outputs.rust == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Rust format
        if: ${{ inputs.suite == 'full' || needs.changes.outputs.rust_lint == 'true' }}
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
      - name: Cargo tests
        if: ${{ inputs.suite == 'full' || needs.changes.outputs.rust_all == 'true' || needs.changes.outputs.rust_filters != '' }}
        env:
          OTTO_SUITE: ${{ inputs.suite || 'fast' }}
          OTTO_RUST_ALL: ${{ needs.changes.outputs.rust_all }}
          OTTO_RUST_FILTERS: ${{ needs.changes.outputs.rust_filters }}
        shell: bash
        run: |
          if [ "$OTTO_SUITE" = "full" ] || [ "$OTTO_RUST_ALL" = "true" ]; then
            cargo test --manifest-path src-tauri/Cargo.toml --locked
          else
            read -r -a rust_filters <<< "$OTTO_RUST_FILTERS"
            cargo test --manifest-path src-tauri/Cargo.toml --locked --lib -- "${rust_filters[@]}"
          fi
      - name: Clippy
        if: ${{ inputs.suite == 'full' || needs.changes.outputs.rust_lint == 'true' }}
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

  native:
    name: Native Windows E2E gate
    needs: [changes, frontend, windows]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') && (needs.windows.result == 'success' || needs.windows.result == 'skipped') && (inputs.suite == 'full' || needs.changes.outputs.native == 'true') }}
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build Otto desktop debug executable
        run: bun run tauri build --debug --no-bundle
      - uses: actions/cache/restore@v4
        if: ${{ inputs.suite == 'full' || needs.changes.outputs.native_transitions == 'true' || needs.changes.outputs.native_p8 == 'true' }}
        id: tauri-driver-cache
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-windows-2.0.6
      - name: Install Tauri WebDriver
        if: ${{ (inputs.suite == 'full' || needs.changes.outputs.native_transitions == 'true' || needs.changes.outputs.native_p8 == 'true') && steps.tauri-driver-cache.outputs.cache-hit != 'true' }}
        run: cargo install tauri-driver --version 2.0.6 --locked
      - uses: actions/cache/save@v4
        if: ${{ (inputs.suite == 'full' || needs.changes.outputs.native_transitions == 'true' || needs.changes.outputs.native_p8 == 'true') && steps.tauri-driver-cache.outputs.cache-hit != 'true' }}
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-windows-2.0.6
      - name: Install Edge WebDriver matching WebView2
        if: ${{ inputs.suite == 'full' || needs.changes.outputs.native_transitions == 'true' || needs.changes.outputs.native_p8 == 'true' }}
        shell: pwsh
        run: |
          $roots = @(
            (Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft\EdgeWebView\Application'),
            (Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'Microsoft\EdgeWebView\Application')
          )
          $runtime = @(
            foreach ($root in $roots) {
              if (Test-Path $root) {
                Get-ChildItem $root -Directory |
                  Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
                  Sort-Object { [version]$_.Name } -Descending
              }
            }
          ) | Select-Object -First 1
          if (-not $runtime) { throw 'WebView2 Runtime unavailable on runner' }
          $driverDir = Join-Path $env:RUNNER_TEMP 'otto-msedgedriver'
          New-Item -ItemType Directory -Path $driverDir -Force | Out-Null
          $archive = Join-Path $driverDir 'driver.zip'
          $url = "https://msedgedriver.microsoft.com/$($runtime.Name)/edgedriver_win64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $driverDir -Force
          if (-not (Test-Path (Join-Path $driverDir 'msedgedriver.exe'))) {
            throw 'Microsoft Edge WebDriver executable is missing'
          }
          $driverDir >> $env:GITHUB_PATH
      - name: Native E2E preflight
        if: ${{ inputs.suite == 'full' || needs.changes.outputs.native_transitions == 'true' || needs.changes.outputs.native_p8 == 'true' }}
        run: node tests/e2e/preflight.mjs
      - name: Native Win32 silhouette and capture gate
        if: ${{ inputs.suite == 'full' || needs.changes.outputs.native_shell == 'true' }}
        timeout-minutes: 10
        run: bun run test:e2e:shell
      - name: Native shell compositing transitions
        if: ${{ inputs.suite == 'full' || needs.changes.outputs.native_transitions == 'true' }}
        timeout-minutes: 10
        run: bun run test:e2e:transitions
      - name: Native P8 background continuity
        if: ${{ inputs.suite == 'full' || needs.changes.outputs.native_p8 == 'true' }}
        timeout-minutes: 10
        run: bun run test:e2e:native
