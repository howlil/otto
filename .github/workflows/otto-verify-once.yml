name: Otto CI

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      suite:
        description: Verification depth
        required: true
        default: full
        type: choice
        options:
          - fast
          - full

permissions:
  contents: read

concurrency:
  group: otto-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OTTO_SUITE: ${{ inputs.suite || 'fast' }}

jobs:
  changes:
    name: Native-relevant change detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect native-relevant paths
        id: filter
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="origin/master"; fi
          if git diff --name-only "$base"...HEAD | grep -Eq '^(src-tauri/|src/(App|AppView|ShellContent|ShellSurfaces)\.(ts|tsx)$|src/features/(shell|os-events)/|src/platform/tauri\.ts$|src/style\.css$|tests/e2e/|design/|\.agents/)'; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Frontend and contract gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint and frontend rules
        run: bun run check
      - name: TypeScript and Vite build
        run: bun run build
      - name: Frontend and CLI contract tests
        run: bun run test:frontend:critical

  windows:
    name: Windows Rust and contract gate
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Rust format
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
      - name: Cargo tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

  native:
    name: Native P8 journey gate
    needs: [changes, windows]
    if: ${{ inputs.suite == 'full' || needs.changes.outputs.native == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build Otto desktop debug executable
        run: bun run tauri build --debug --no-bundle
      - uses: actions/cache/restore@v4
        id: tauri-driver-cache
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-windows-2.0.6
      - name: Install Tauri WebDriver
        if: ${{ steps.tauri-driver-cache.outputs.cache-hit != 'true' }}
        run: cargo install tauri-driver --version 2.0.6 --locked
      - uses: actions/cache/save@v4
        if: ${{ steps.tauri-driver-cache.outputs.cache-hit != 'true' }}
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-windows-2.0.6
      - name: Install Edge WebDriver matching WebView2
        shell: pwsh
        run: |
          $roots = @(
            (Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft\EdgeWebView\Application'),
            (Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'Microsoft\EdgeWebView\Application')
          )
          $runtime = @(
            foreach ($root in $roots) {
              if (Test-Path $root) {
                Get-ChildItem $root -Directory |
                  Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
                  Sort-Object { [version]$_.Name } -Descending
              }
            }
          ) | Select-Object -First 1
          if (-not $runtime) { throw 'WebView2 Runtime unavailable on runner' }
          $driverDir = Join-Path $env:RUNNER_TEMP 'otto-msedgedriver'
          New-Item -ItemType Directory -Path $driverDir -Force | Out-Null
          $archive = Join-Path $driverDir 'driver.zip'
          $url = "https://msedgedriver.microsoft.com/$($runtime.Name)/edgedriver_win64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $driverDir -Force
          if (-not (Test-Path (Join-Path $driverDir 'msedgedriver.exe'))) {
            throw 'Microsoft Edge WebDriver executable is missing'
          }
          $driverDir >> $env:GITHUB_PATH
      - name: Native E2E preflight
        run: node tests/e2e/preflight.mjs
      - name: Native Win32 silhouette and capture gate
        timeout-minutes: 10
        run: bun run test:e2e:shell
      - name: Native shell compositing transitions
        timeout-minutes: 10
        run: bun run test:e2e:transitions
      - name: Native P8 background continuity
        timeout-minutes: 10
        run: bun run test:e2e:native
      - name: Native OS event capsule
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'full' }}
        timeout-minutes: 10
        run: bun run test:e2e:os-events
