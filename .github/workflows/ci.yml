name: CI

'on':
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  foundation:
    name: Windows foundation
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Require reproducible dependency locks
        shell: pwsh
        run: |
          if (!(Test-Path bun.lock)) { throw 'Commit bun.lock generated by bun install.' }
          if (!(Test-Path src-tauri/Cargo.lock)) { throw 'Commit src-tauri/Cargo.lock generated by cargo generate-lockfile.' }

      - uses: oven-sh/setup-bun@v2

      - name: Install frozen JS dependencies
        run: bun ci

      - name: Frontend format and lint
        run: bun run check

      - name: Type-check and build frontend
        run: bun run build

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust lint and compilation
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
